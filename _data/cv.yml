    Publications:
      - title: 
Enhancing SUMO simulator for simulation based testing and validation of autonomous vehicles
        authors:
          - Arpan Kusari, Pei Li, Hanzhi Yang, and Nikhil Punshi, Mich Rasulis, Scott Bogard, David J. LeBlanc
        publisher: 2022 IEEE Intelligent Vehicles Symposium (IV)
        releaseDate: 2022-6-4
        url: https://doi.org/10.1109/IV51971.2022.9827241
        summary: Current autonomous vehicle (AV) simulators are built to provide large-scale testing required to prove capabilities under varied conditions in controlled, repeatable fashion. However, they have certain failings including the need for user expertise and complex inconvenient tutorials for customized scenario creation. Simulation of Urban Mobility (SUMO) simulator, which has been presented as an open-source traffic simulation platform, has found use as an AV simulator but suffers from similar issues which makes it difficult for entry-level practitioners to utilize the simulator without significant time investment. In that regard, we provide two enhancements to SUMO simulator geared towards massively improving user experience and providing real-life like variability for surrounding traffic. Firstly, we calibrate a car-following model, Intelligent Driver Model (IDM), for highway and urban naturalistic driving data and sample randomly from the parameter distributions to create realistic background vehicle driving behavior. Secondly, we combine SUMO with OpenAI gym, creating a Python package placed in a docker container which can run simulations based on real world highway and urban layouts with generic output observations and input actions that can be processed via any AV pipeline. For the calibration, we provide results using simulated and real-life data. For the Sumo-Gym package, we showcase a simple AV platform which runs IDM and lane change throughout the highway loop and provide some qualitative results. Our aim through these enhancements is to provide an easy-to-use simulation environment which can be installed in any operating platform and can be readily used for AV testing and validation.
     
      - title: 
Linear Modeling and Open-loop Control of a Multi-Axis Piezoelectric Micro-Mirror for Random-Access Laser Scanning
        authors:
          - Hanzhi Yang, Joonyoung Yu, Mayur B. Birla, and Thomas D. Wang, Kenn R. Oldham
        publisher: 
        releaseDate: 2nd Modeling, Estimation and Control Conference MECC 2022
        url: https://doi.org/10.1016/j.ifacol.2022.11.171
        summary: This paper presents an early-stage model of a thin-film piezoelectric MEMS scanning mirror designed for random-access scanning over a considerable range. The high energy density of piezoelectric materials enables both high resonant frequencies and significant static offsets, facilitating the redirection of scans to specific locations within a large field of view. The study establishes a linearized modal model for the piezoelectric scanner and proposes an open-loop strategy for transitioning between full-field and narrow-field scanning. It also simulates the effects of step-wise transitions between operating modes on settling time and overshoot.
      
      - title: 
Gliding in extreme waters - Dynamic Modeling and Nonlinear Control of an Agile Underwater Glider
        authors:
          - Hanzhi Yang and Nina Mahmoudian
        publisher: 15th IFAC Conference on Control Applications in Marine Systems, Robotics and Vehicles CAMS 2024
        releaseDate: 2024-9-3
        url: https://doi.org/https://doi.org/10.1016/j.ifacol.2024.10.042
summary: This paper presents a data-driven, nonlinear dynamics model and a Lyapunov-based controller for a custom underwater glider, aimed at improving navigation in constrained, dynamic environments. The proposed hybrid system, combining this nonlinear controller with PID control, is validated in simulations for reliable performance against environmental disturbances and during complex flight transitions.
      - title: 

Under-ice Trajectory Tracking for Underwater Gliders Using Fuzzy-based Adaptive Control
authors:
          - Hanzhi Yang and Nina Mahmoudian
        publisher: 2024 IEEE/OES Autonomous Underwater Vehicles Symposium (AUV)
        releaseDate: 2024-9-18
        url: https://doi.org/10.1109/AUV61864.2024.11030787
summary: A dual-layer fuzzy adaptive control framework, designed with backstepping techniques and optimized via particle swarm optimization (PSO), has been developed for underwater gliders operating in ice-covered environments. Simulation results confirm the approach ensures high-accuracy tracking of depth, pitch, and heading while effectively managing unknown environmental disturbances.
      - title: 

Finite-time prescribed performance with fixed-time disturbance rejection for underwater glider heading control
authors:
          - Hanzhi Yang and Nina Mahmoudian
        publisher: Ocean Engineering
        releaseDate: 2025-10-1
        url: https://doi.org/10.1016/j.oceaneng.2025.121842
summary: This paper introduces a robust heading control strategy for underwater gliders that guarantees finite-time tracking error convergence despite model uncertainties, actuator limits, and environmental disturbances. The framework improves upon traditional sliding mode control systems by enhancing tracking accuracy, acceleration speeds, and overall path robustness. 



